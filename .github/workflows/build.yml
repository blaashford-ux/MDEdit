name: build

on:
  push:
    branches: ['**'] # tags are handled by release.yml, which calls this workflow
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml so a release runs the same tests, build and smoke test

env:
  # GitHub is retiring the Node 20 runtime for actions; run them on Node 24 now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: System tools used by the integration tests
        # xvfb: run Electron headless (print-PDF tests) · poppler: pdfinfo/pdffonts · java + epubcheck: EPUB validation
        # libreoffice-writer: opens the generated DOCX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb poppler-utils default-jre-headless libreoffice-writer
          pip install epubcheck
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:electron
      - name: Tests (unit + real Electron/Paged.js PDF + epubcheck + DOCX)
        run: xvfb-run -a npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the installer
        shell: pwsh
        env:
          # Optional code signing. Add these repository secrets to sign the installer and avoid SmartScreen warnings:
          #   WIN_CSC_LINK (base64 .pfx or URL), WIN_CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Google Drive sync: the Desktop OAuth client's secret (repository secret GOOGLE_DESKTOP_CLIENT_SECRET).
          MDEDIT_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK, Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
            Write-Host 'No signing certificate configured: building an UNSIGNED installer.'
          }
          npm run dist
      - name: Smoke test the packaged app (exports EPUB, PDF and DOCX with the bundled fonts)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath 'release\win-unpacked\MDEdit.exe' -ArgumentList "--smoke-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Host 'The smoke test wrote no result file.' }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: MDEdit-windows-installer
          path: release/MDEdit-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
